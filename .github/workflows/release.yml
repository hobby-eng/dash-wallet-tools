name: Build and publish Dash Community release

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      source_ref:
        description: Immutable multi-chain-wallet-tools commit or tag
        required: false
        type: string
      release_tag:
        description: Release tag matching the canonical package version
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: dash-community-release
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      source_ref: ${{ steps.release.outputs.source_ref }}
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - name: Find a published canonical release not yet distributed
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SOURCE_REF: ${{ inputs.source_ref }}
          MANUAL_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          echo 'publish=false' >> "$GITHUB_OUTPUT"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" > distribution-releases.json
          if [[ "$EVENT_NAME" == 'workflow_dispatch' && ( -n "$MANUAL_SOURCE_REF" || -n "$MANUAL_RELEASE_TAG" ) ]]; then
            source_ref="$MANUAL_SOURCE_REF"
            release_tag="$MANUAL_RELEASE_TAG"
          else
            # Automatic distribution starts with the first Dash repository release, v0.1.2.
            gh api --paginate --slurp repos/hobby-eng/multi-chain-wallet-tools/releases > canonical-releases.json
            release_tag=$(jq -r --slurpfile distribution distribution-releases.json '
              ($distribution[0] | flatten | map(.tag_name)) as $existing |
              [ .[][] |
                select(.draft == false and .prerelease == false) |
                select(.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) |
                . as $release |
                select(($existing | index($release.tag_name)) == null) |
                select((.tag_name | ltrimstr("v") | split(".") | map(tonumber)) >= [0,1,2])
              ] | sort_by(.published_at) | .[0].tag_name // empty
            ' canonical-releases.json)
            if [[ -z "$release_tag" ]]; then
              echo 'All published canonical versions with Dash support are already distributed.'
              exit 0
            fi
            source_ref="$release_tag"
          fi
          if [[ "$source_ref" != "$release_tag" || ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Source and release must name the same semantic version tag.' >&2
            exit 1
          fi
          gh api "repos/hobby-eng/multi-chain-wallet-tools/releases/tags/$release_tag" > selected-release.json
          if ! jq -e '(.draft == false) and (.prerelease == false)' selected-release.json >/dev/null; then
            echo 'Only published stable canonical releases may be distributed.' >&2
            exit 1
          fi
          if jq -e --arg tag "$release_tag" 'any(.[][]; .tag_name == $tag)' distribution-releases.json >/dev/null; then
            echo "Dash release $release_tag already exists; nothing to publish."
            exit 0
          fi
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo 'publish=true' >> "$GITHUB_OUTPUT"

  release:
    needs: resolve
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the distribution repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hobby-eng/multi-chain-wallet-tools
          ref: ${{ needs.resolve.outputs.source_ref }}
          path: source
          persist-credentials: false

      - name: Validate release identity
        id: source
        shell: bash
        env:
          SOURCE_REF: ${{ needs.resolve.outputs.source_ref }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "$SOURCE_REF" != "$RELEASE_TAG" ]]; then
            echo "source_ref and release_tag must name the same canonical tag." >&2
            exit 1
          fi
          source_sha=$(git -C source rev-parse HEAD)
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Canonical source did not resolve to a full commit." >&2
            exit 1
          fi
          expected_tag="v$(jq --raw-output '.version' source/package.json)"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "Release tag $RELEASE_TAG does not match canonical version $expected_tag." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use semantic vX.Y.Z form." >&2
            exit 1
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Build and verify in the canonical container
        shell: bash
        run: |
          set -euo pipefail
          cd source
          ./tooling/build-reproducible.sh

      - name: Select and verify the Dash-only release bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          cp source/dist/dash-community-edition/release/* release-assets/
          node source/tooling/verify-github-release-assets.mjs --profile dash-community
          actual=$(find release-assets -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          expected=$(find source/dist/dash-community-edition/release -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          if [[ "$actual" != "$expected" ]]; then
            echo 'Copied Dash release assets differ from the canonically verified bundle.' >&2
            exit 1
          fi
          (cd release-assets && sha256sum -c SHA256SUMS)
          if find release-assets -maxdepth 1 -type f -name 'Wallet_*' | grep -q .; then
            echo "Multi-Chain artifact found in Dash Community release." >&2
            exit 1
          fi

      - name: Generate build-provenance attestations
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/*

      - name: Publish the verified Dash Community release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          SOURCE_REF: ${{ needs.resolve.outputs.source_ref }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          notes_file="source/docs/releases/${RELEASE_TAG}-dash-community.md"
          if [[ ! -f "$notes_file" ]]; then
            echo "Missing curated Dash Community release notes: $notes_file" >&2
            exit 1
          fi
          cp "$notes_file" release-notes.md
          cat >> release-notes.md <<EOF

          ---

          Canonical source ref: \`${SOURCE_REF}\`

          Canonical source commit: \`${SOURCE_SHA}\`
          EOF
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --notes-file release-notes.md \
            --latest \
            --title "Dash Community Wallet Tools $RELEASE_TAG"
